<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщения - Мой Сайт</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">МойСайт</a>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="profile.html">Личный кабинет</a></li>
                <li><a href="messages.html">Сообщения</a></li>
                <li><a href="stats.html">Статистика</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="messages">
            <h1>Сообщения</h1>
            
            <div class="message-form">
                <h2>Отправить сообщение</h2>
                <form>
                    <div class="form-group">
                        <label for="recipient">Получатель:</label>
                        <input type="text" id="recipient" placeholder="Введите имя получателя">
                    </div>
                    <div class="form-group">
                        <label for="message">Сообщение:</label>
                        <textarea id="message" rows="4" placeholder="Введите ваше сообщение"></textarea>
                    </div>
                    <button type="submit" class="btn">Отправить</button>
                </form>
            </div>

            <div class="inbox">
                <h2>Входящие сообщения</h2>
            </div>
        </section>
    </main>
</body>
</html>
